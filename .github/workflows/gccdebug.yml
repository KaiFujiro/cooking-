name: gcc build debug

on:
  workflow_dispatch:
    inputs:
      repository: { description: 'Repo', required: true, default: 'rezadinosaurus/butterflies_xiaomi_sm8250' }
      branch: { description: 'Branch', required: true, default: 'lineage-gcc' }
      defconfig: { description: 'Defconfig', required: true, default: 'vendor/alioth_defconfig' }
      kernelsu_branch: { description: 'KSU Branch', required: false, default: 'master' }

env:
  CHAT_ID: "7019311871"
  BOT_TOKEN: "8713971958:AAGW8VL9OIT6sw7XZKyVJyrWCF3IP3sIRlo"
  KBUILD_BUILD_USER: "lloromannic"
  KBUILD_BUILD_HOST: "stargaze"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        repository: ${{ github.event.inputs.repository }}
        ref: ${{ github.event.inputs.branch }}
        submodules: recursive

    - name: Start Notification
      run: |
        curl -s -X POST "https://api.telegram.org/bot${{ env.BOT_TOKEN }}/sendMessage" \
        -d chat_id="${{ env.CHAT_ID }}" \
        -d text="build is starting sayangg: ${{ github.event.inputs.repository }} [${{ github.event.inputs.branch }}]"

    - name: Setup and Build
      run: |
        sudo apt-get update && sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc zip gcc-arm-linux-gnueabi python3 python-is-python3 git wget curl zstd xz-utils

        export TZ="Asia/Jakarta"
        BUILD_TIME=$(date +'%H%M-%d%m%y')
        echo "BUILD_TIME=$BUILD_TIME" >> $GITHUB_ENV

        mkdir -p tc/gcc
        wget -q "https://github.com/mvaisakh/gcc-build/releases/download/06092026/eva-gcc-arm64-06092026.xz" -O tc/gcc.tar.xz
        tar -xf tc/gcc.tar.xz -C tc/gcc --strip-components=1
        export PATH=$PWD/tc/gcc/bin:$PATH

        GCC_PREFIX=$(find $PWD/tc/gcc/bin -name '*-gcc' | head -n1 | sed 's/.*\///;s/gcc$//')
        echo "Detected GCC prefix: $GCC_PREFIX"

        curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh" | bash -s ${{ github.event.inputs.kernelsu_branch }}

        export ARCH=arm64
        ARGS="O=out ARCH=arm64 CROSS_COMPILE=${GCC_PREFIX} CROSS_COMPILE_ARM32=arm-linux-gnueabi- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- KCFLAGS=-Wno-error"

        make $ARGS ${{ github.event.inputs.defconfig }}
        make -j$(nproc) $ARGS vmlinux 2>&1 | tee compile.log

        # --- Zip vmlinux ---
        if [ -f out/vmlinux ]; then
          cp out/vmlinux ./vmlinux
          zip "vmlinux-$BUILD_TIME.zip" vmlinux
          echo "VMLINUX_ZIP=vmlinux-$BUILD_TIME.zip" >> $GITHUB_ENV
        fi

        # --- Zip System.map ---
        if [ -f out/System.map ]; then
          cp out/System.map ./System.map
          zip "System.map-$BUILD_TIME.zip" System.map
          echo "SYSMAP_ZIP=System.map-$BUILD_TIME.zip" >> $GITHUB_ENV
        fi

    - name: Upload Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Build-${{ env.BUILD_TIME }}
        path: |
          *.log
          *.zip
        retention-days: 1

    - name: Telegram Notification
      if: always()
      run: |
        send_doc() {
          local file="$1"
          local caption="$2"
          if [ -f "$file" ]; then
            curl -s -F document=@"$file" "https://api.telegram.org/bot${{ env.BOT_TOKEN }}/sendDocument" \
              -F chat_id="${{ env.CHAT_ID }}" -F caption="$caption"
          fi
        }

        send_doc "compile.log" "Build log"
        send_doc "${{ env.VMLINUX_ZIP }}" "vmlinux"
        send_doc "${{ env.SYSMAP_ZIP }}" "System.map"
